plugins {
    id 'java'
}

group = 'me.uc_hussein'
version = '1.0.0'

// Defaults target Paper 26.2 on Java 25.
// Build for Minecraft 1.21.x instead with:
//   gradle build -PpaperVersion=1.21.4-R0.1-SNAPSHOT -PjavaRelease=21
def paperVersion = (findProperty('paperVersion') ?: '26.2.build.+').toString()
def javaRelease = (findProperty('javaRelease') ?: '25').toString().toInteger()

repositories {
    mavenCentral()
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaRelease
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    archiveBaseName = 'ULTRAS_Broadcast_V1'
}
